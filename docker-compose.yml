# =============================================================================
# bogana-ai-erp-system — topologi service
#
#   PHP (dashboard)  ──HTTP/JSON──▶  FastAPI (ai_service)  ──▶  PostgreSQL
#        │                                   │
#        └───────────────▶  Redis  ◀─────────┘
#
# Service:
#   db         PostgreSQL 16  (database/schema.sql sebagai sumber kebenaran)
#   redis      Redis 7        (cache stok, dashboard, idempotensi parser)
#   ai_service FastAPI        (NLP parser, cek stok, forecast)
#   php        Dashboard ERP (PHP 8.2 + Apache)
#
# Jalankan:  docker compose up -d --build
# Seed DB :  docker compose exec -T db psql -U postgres -d bogana -f - < database/schema.sql
# =============================================================================

name: bogana-ai-erp-system

services:
  db:
    image: postgres:16-alpine
    container_name: bogana-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bogana}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bogana}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: bogana-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: bogana-ai-service
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bogana}
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-internal-token}
      AI_SERVICE_AUTH_DISABLED: ${AI_SERVICE_AUTH_DISABLED:-true}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bogana-php
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-bogana}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai_service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-internal-token}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "${PHP_PORT:-8080}:80"
    depends_on:
      ai_service:
        condition: service_healthy

volumes:
  pgdata:
  redisdata: