# =============================================================================
# render.yaml — deployment gratis (Render + Neon + Upstash)
#
#   PHP (dashboard)  ──HTTPS/JSON──▶  FastAPI (ai_service)  ──▶  Neon PostgreSQL
#        │                                     │
#        └───────────────▶  Upstash Redis  ◀───┘
#
# Deploy (tanpa kartu kredit):
#   1. Neon    : buat project PostgreSQL, copy connection string (direct)
#   2. Upstash : buat database Redis (opsional), copy rediss:// URL
#   3. Render  : New -> Blueprint -> pilih repo ini -> isi DATABASE_URL/REDIS_URL
#
# Catatan free tier:
#   - Web service free tidur setelah 15 menit idle, bangun ~1 menit.
#   - Kuota 750 jam/bulan per workspace (cukup untuk dua service yang sleep).
#   - Neon free: 1 GB, 100 CU-hours/project/bulan, scale-to-zero.
#   - Upstash free: 250 MB, 500K commands/bulan.
#
# Panduan lengkap: docs/DEPLOY_RENDER_FREE.md
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # FastAPI: NLP parser, cek stok, alokasi, dashboard, forecast
  # ---------------------------------------------------------------------------
  - type: web
    name: bogana-ai-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./ai_service/Dockerfile
    dockerContext: ./ai_service
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: TZ
        value: Asia/Jakarta
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AI_SERVICE_TOKEN
        generateValue: true
      - key: AI_SERVICE_AUTH_DISABLED
        value: "false"

  # ---------------------------------------------------------------------------
  # PHP dashboard (Apache + PHP 8.2)
  # ---------------------------------------------------------------------------
  - type: web
    name: bogana-php
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz.php
    envVars:
      - key: APP_ENV
        value: production
      - key: TZ
        value: Asia/Jakarta
      # Apache pada image ini listen di port 80.
      - key: PORT
        value: "80"
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: bogana-ai-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_SERVICE_TOKEN
        fromService:
          type: web
          name: bogana-ai-service
          envVarKey: AI_SERVICE_TOKEN
      - key: AI_SERVICE_AUTH_DISABLED
        value: "false"
      # Naikkan timeout agar request pertama tidak gagal saat AI service cold start.
      - key: AI_SERVICE_TIMEOUT
        value: "60"